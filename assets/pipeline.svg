<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Battery contacting quality prediction pipeline</title>
  <desc id="desc">A project-specific but NDA-safe pipeline for battery contact weld quality prediction using optical time-series signals, preprocessing, feature extraction, Random Forest, LSTM, private evaluation, and public synthetic demos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf7f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .page { fill: url(#bg); }
      .title { fill: #0f172a; font: 700 34px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 400 16px Arial, sans-serif; }
      .chip { fill: url(#accent); }
      .chipText { fill: #ffffff; font: 700 12px Arial, sans-serif; letter-spacing: 0.35px; }
      .group { fill: #ffffff; stroke: #d7e1ee; stroke-width: 1.2; filter: url(#shadow); }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; filter: url(#shadow); }
      .private { fill: #fff7ed; stroke: #fdba74; }
      .public { fill: #ecfdf5; stroke: #86efac; }
      .model { fill: #eff6ff; stroke: #93c5fd; }
      .label { fill: #0f172a; font: 700 17px Arial, sans-serif; }
      .text { fill: #475569; font: 400 13px Arial, sans-serif; }
      .small { fill: #64748b; font: 400 12px Arial, sans-serif; }
      .lane { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .laneLabel { fill: #334155; font: 700 13px Arial, sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .branch { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .publish { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
      .boundary { stroke: #94a3b8; stroke-width: 1.7; stroke-dasharray: 7 7; fill: none; }
      .iconTeal { fill: #0f766e; }
      .iconBlue { fill: #2563eb; }
      .iconAmber { fill: #d97706; }
      .iconGreen { fill: #059669; }
      .iconSlate { fill: #475569; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1200" height="640"/>

  <text class="title" x="54" y="56">Battery Contacting Quality Prediction Pipeline</text>
  <text class="subtitle" x="56" y="84">Project-specific workflow, redrawn as a public-safe portfolio artifact. Sensitive data and exact results are not published.</text>
  <rect class="chip" x="56" y="110" width="298" height="30" rx="15"/>
  <text class="chipText" x="78" y="130">NDA-SAFE PUBLIC README DIAGRAM</text>

  <rect class="group" x="42" y="164" width="1116" height="274" rx="18"/>
  <text class="small" x="70" y="194">Private project workflow represented without raw data, partner details, labels, figures, or exact metrics</text>

  <g transform="translate(72 232)">
    <rect class="card private" x="0" y="0" width="168" height="118" rx="13"/>
    <path class="iconAmber" d="M28 26 h42 a9 9 0 0 1 9 9 v34 a9 9 0 0 1-9 9 h-42 a9 9 0 0 1-9-9 v-34 a9 9 0 0 1 9-9z"/>
    <path d="M34 42 h28 M34 55 h34 M34 68 h22" stroke="#fff7ed" stroke-width="6" stroke-linecap="round"/>
    <text class="label" x="22" y="92">Weld Runs</text>
    <text class="text" x="22" y="110">VIS/NIR signals</text>
  </g>

  <text class="small" x="80" y="370">SQLite sensor databases</text>
  <text class="small" x="80" y="388">Experiment table + quality labels</text>

  <path class="arrow" d="M 248 291 L 290 291"/>

  <g transform="translate(300 232)">
    <rect class="card" x="0" y="0" width="168" height="118" rx="13"/>
    <path class="iconTeal" d="M30 30 h42 v9 h-42z M30 48 h54 v9 h-54z M30 66 h36 v9 h-36z"/>
    <text class="label" x="28" y="94">Load Data</text>
    <text class="text" x="96" y="42">SQLite</text>
    <text class="text" x="96" y="61">tables</text>
    <text class="text" x="96" y="80">configs</text>
  </g>

  <path class="arrow" d="M 476 291 L 518 291"/>

  <g transform="translate(528 232)">
    <rect class="card" x="0" y="0" width="168" height="118" rx="13"/>
    <path d="M28 78 C44 34, 58 34, 72 78 S102 118, 136 42" stroke="#2563eb" stroke-width="7" fill="none" stroke-linecap="round"/>
    <text class="label" x="28" y="38">Preprocess</text>
    <text class="text" x="28" y="98">filter, trim, smooth</text>
  </g>

  <path class="arrow" d="M 704 291 L 744 291"/>

  <g transform="translate(754 208)">
    <rect class="lane" x="0" y="0" width="192" height="70" rx="12"/>
    <circle class="iconGreen" cx="30" cy="35" r="16"/>
    <text x="20" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">FE</text>
    <text class="laneLabel" x="58" y="28">Feature Branch</text>
    <text class="text" x="58" y="48">statistical descriptors</text>
  </g>

  <g transform="translate(754 306)">
    <rect class="lane" x="0" y="0" width="192" height="70" rx="12"/>
    <path class="iconBlue" d="M18 48 C28 24, 38 24, 48 48 S68 72, 88 30" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text class="laneLabel" x="96" y="28">Sequence Branch</text>
    <text class="text" x="96" y="48">time-series tensors</text>
  </g>

  <path class="branch" d="M 704 291 C 726 291, 726 243, 746 243"/>
  <path class="branch" d="M 704 291 C 726 291, 726 341, 746 341"/>

  <g transform="translate(996 194)">
    <rect class="card model" x="0" y="0" width="146" height="88" rx="13"/>
    <text class="label" x="24" y="34">Random</text>
    <text class="label" x="24" y="56">Forest</text>
    <text class="text" x="24" y="76">baseline + tuning</text>
  </g>

  <g transform="translate(996 312)">
    <rect class="card model" x="0" y="0" width="146" height="88" rx="13"/>
    <text class="label" x="24" y="36">LSTM</text>
    <text class="text" x="24" y="62">sequence model</text>
    <text class="text" x="24" y="78">augmentation</text>
  </g>

  <path class="arrow" d="M 954 243 L 988 243"/>
  <path class="arrow" d="M 954 341 L 988 341"/>

  <rect class="group" x="42" y="476" width="520" height="104" rx="16"/>
  <text class="label" x="72" y="514">Public GitHub Output</text>
  <text class="text" x="72" y="540">Reusable Python modules, synthetic demos, and documentation</text>
  <text class="text" x="72" y="558">show the engineering approach without private project material.</text>

  <rect class="group private" x="640" y="476" width="500" height="104" rx="16"/>
  <text class="label" x="670" y="514">Private Analysis Output</text>
  <text class="text" x="670" y="540">Model comparison, error analysis, and final interpretation</text>
  <text class="text" x="670" y="558">remain outside the public repository.</text>

  <path class="boundary" d="M 592 488 L 592 578"/>
  <text class="small" x="575" y="602">publication boundary</text>

  <path class="branch" d="M 1068 282 C 1068 430, 826 430, 826 468"/>
  <path class="branch" d="M 1068 400 C 1068 438, 1010 438, 1010 468"/>
  <path class="publish" d="M 302 438 L 302 468"/>
</svg>
