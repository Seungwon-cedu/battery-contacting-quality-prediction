<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">NDA-safe machine learning pipeline</title>
  <desc id="desc">A clean pipeline diagram for a public portfolio repository. Private data stays local, reusable code is published, and synthetic demos make the workflow reviewable.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .page { fill: url(#page); }
      .title { fill: #0f172a; font: 700 34px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 400 17px Arial, sans-serif; }
      .band { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1.2; filter: url(#softShadow); }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; filter: url(#softShadow); }
      .cardPrivate { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.4; filter: url(#softShadow); }
      .cardPublic { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.4; filter: url(#softShadow); }
      .cardModel { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.4; filter: url(#softShadow); }
      .label { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .text { fill: #475569; font: 400 13.5px Arial, sans-serif; }
      .small { fill: #64748b; font: 400 12.5px Arial, sans-serif; }
      .chipText { fill: #ffffff; font: 700 12px Arial, sans-serif; letter-spacing: 0.4px; }
      .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .merge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; }
      .iconTeal { fill: #0f766e; }
      .iconBlue { fill: #2563eb; }
      .iconAmber { fill: #d97706; }
      .iconGreen { fill: #059669; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1200" height="560"/>

  <text class="title" x="56" y="58">Public-Safe ML Pipeline</text>
  <text class="subtitle" x="58" y="86">Code is reviewable on GitHub. Original data, labels, reports, partner details, and exact private results stay outside the repository.</text>
  <rect x="56" y="112" width="282" height="30" rx="15" fill="url(#accent)"/>
  <text class="chipText" x="78" y="132">NDA-SAFE PORTFOLIO VERSION</text>

  <rect class="band" x="42" y="164" width="1116" height="202" rx="18"/>
  <text class="small" x="70" y="194">Reusable workflow represented by the public code</text>

  <g transform="translate(72 222)">
    <rect class="cardPrivate" x="0" y="0" width="150" height="98" rx="12"/>
    <path class="iconAmber" d="M28 24 h34 a8 8 0 0 1 8 8 v34 a8 8 0 0 1-8 8 h-34 a8 8 0 0 1-8-8 v-34 a8 8 0 0 1 8-8z"/>
    <rect x="32" y="38" width="24" height="6" rx="3" fill="#fff7ed"/>
    <rect x="32" y="52" width="32" height="6" rx="3" fill="#fff7ed"/>
    <text class="label" x="84" y="34">Private</text>
    <text class="label" x="84" y="56">Inputs</text>
    <text class="text" x="22" y="86">kept local</text>
  </g>

  <path class="arrow" d="M 230 271 L 277 271"/>

  <g transform="translate(286 222)">
    <rect class="card" x="0" y="0" width="150" height="98" rx="12"/>
    <path class="iconTeal" d="M26 28 h42 v9 h-42z M26 45 h54 v9 h-54z M26 62 h34 v9 h-34z"/>
    <text class="label" x="86" y="36">Load</text>
    <text class="text" x="86" y="61">SQLite</text>
    <text class="text" x="86" y="79">config</text>
  </g>

  <path class="arrow" d="M 444 271 L 491 271"/>

  <g transform="translate(500 222)">
    <rect class="card" x="0" y="0" width="150" height="98" rx="12"/>
    <path d="M24 65 C40 28, 54 28, 68 65 S96 102, 124 36" stroke="#2563eb" stroke-width="7" fill="none" stroke-linecap="round"/>
    <text class="label" x="82" y="36">Clean</text>
    <text class="text" x="22" y="72">trim + smooth</text>
  </g>

  <path class="arrow" d="M 658 271 L 705 271"/>

  <g transform="translate(714 222)">
    <rect class="card" x="0" y="0" width="150" height="98" rx="12"/>
    <circle class="iconGreen" cx="42" cy="44" r="18"/>
    <text x="31" y="50" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">FE</text>
    <text class="label" x="82" y="36">Features</text>
    <text class="text" x="22" y="72">signal descriptors</text>
  </g>

  <path class="arrow" d="M 872 271 L 914 271"/>

  <g transform="translate(922 188)">
    <rect class="cardModel" x="0" y="0" width="184" height="166" rx="14"/>
    <text class="label" x="26" y="36">Modeling</text>
    <rect x="24" y="56" width="136" height="36" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text class="text" x="42" y="79">Random Forest</text>
    <rect x="24" y="106" width="136" height="36" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text class="text" x="56" y="129">LSTM</text>
  </g>

  <g transform="translate(786 408)">
    <rect class="cardPrivate" x="0" y="0" width="332" height="88" rx="14"/>
    <text class="label" x="26" y="34">Private Evaluation</text>
    <text class="text" x="26" y="59">Model comparison and result analysis</text>
    <text class="text" x="26" y="76">are performed privately, not published.</text>
  </g>

  <path class="merge" d="M 1014 354 C 1014 386, 952 386, 952 404"/>

  <g transform="translate(72 408)">
    <rect class="cardPublic" x="0" y="0" width="606" height="88" rx="14"/>
    <text class="label" x="28" y="34">Public GitHub Artifact</text>
    <text class="text" x="28" y="59">Reusable Python package, synthetic demos, and README documentation</text>
    <text class="text" x="28" y="76">show the engineering approach without exposing private project material.</text>
  </g>

  <path class="dashed" d="M 678 452 L 782 452"/>
  <text class="small" x="700" y="440">boundary</text>

  <text class="small" x="72" y="526">Public: code structure, preprocessing, feature engineering, RF/LSTM workflow, synthetic smoke tests.</text>
  <text class="small" x="678" y="526">Private: original data, labels, reports, partner context, and exact private-dataset metrics.</text>
</svg>
